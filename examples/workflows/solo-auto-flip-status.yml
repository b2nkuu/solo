# solo-auto-flip-status.yml
#
# Drop this file into your repo at `.github/workflows/solo-auto-flip-status.yml`
# to keep solo's `status:*` labels and `completed:` metadata honest when issues
# are closed or reopened outside `/solo:done` (e.g. by a PR's `Closes #<n>`).
#
# Problem this solves:
#   GitHub closes the linked issue when a PR merges, but the `status:*` label
#   is sticky, and nothing writes `completed:` into the `solo:metadata` block.
#   `/solo:today` shows stale buckets and `/solo:retro` cannot compute cycle
#   time for tickets without `completed:`.
#
# What this workflow does (reads the LIVE issue state via gh, never the event
# payload, so a re-run or a dispatch always sees the truth):
#   - closed as completed        -> swap `status:*` for `status:done` and write
#                                   `completed: <date>` in the `solo:metadata`
#                                   block (block is created if missing; an
#                                   existing `completed:` value is never
#                                   overwritten; all other bytes are untouched)
#   - closed as not planned or   -> remove `status:*`, write no `completed:`
#     duplicate
#   - reopened                   -> `status:in-progress`, clear `completed:`
#   Idempotent — re-running on an already-correct issue changes nothing.
#
# Timezone:
#   `completed:` is the close date in the timezone set by SOLO_TZ below (an IANA
#   name such as `Asia/Bangkok`). This is the only place to change it.
#
# Permissions:
#   `issues: write` only. No checkout — everything goes through `gh`.
#
# Manual trigger:
#   `workflow_dispatch` with an `issue_number` fixes up one issue — handy to
#   sweep historically closed issues after adopting the workflow. Dispatching
#   on an open issue is a no-op (only a `reopened` event flips to in-progress).

name: solo — auto-flip status on close/reopen

env:
  SOLO_TZ: "UTC"   # <- the one place to set the timezone for `completed:` dates

on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to fix up (workflow_dispatch only)"
        required: true
        type: string

permissions:
  issues: write

jobs:
  sync-status:
    name: "Sync status:* and completed:"
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # Live state — not the event payload.
          ISSUE=$(gh issue view "$NUMBER" --repo "$REPO" --json state,stateReason,closedAt,labels,body)
          STATE=$(jq -r '.state' <<< "$ISSUE")
          REASON=$(jq -r '.stateReason // ""' <<< "$ISSUE")
          CLOSED_AT=$(jq -r '.closedAt // ""' <<< "$ISSUE")
          STATUS_LABELS=$(jq -r '.labels[].name | select(startswith("status:"))' <<< "$ISSUE")
          echo "issue #$NUMBER state=$STATE reason=$REASON"

          # Decide the target: WANT_LABEL ("" = none), META (set|clear|none).
          if [ "$STATE" = "OPEN" ]; then
            if [ "$EVENT_ACTION" != "reopened" ]; then
              echo "open issue, not a reopen event — no-op"; exit 0
            fi
            WANT_LABEL="status:in-progress"; META=clear
          else
            case "$REASON" in
              NOT_PLANNED|DUPLICATE) WANT_LABEL=""; META=none ;;
              *)                     WANT_LABEL="status:done"; META=set ;;
            esac
          fi

          # Labels: remove every status:* other than the target, add the target.
          if [ -n "$WANT_LABEL" ]; then
            gh label create "$WANT_LABEL" --color "cccccc" --repo "$REPO" >/dev/null 2>&1 || true
          fi
          while IFS= read -r L; do
            [ -z "$L" ] && continue
            [ "$L" = "$WANT_LABEL" ] && continue
            echo "removing $L"
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label "$L"
          done <<< "$STATUS_LABELS"
          if [ -n "$WANT_LABEL" ] && ! grep -qxF "$WANT_LABEL" <<< "$STATUS_LABELS"; then
            echo "adding $WANT_LABEL"
            gh issue edit "$NUMBER" --repo "$REPO" --add-label "$WANT_LABEL"
          fi

          [ "$META" = "none" ] && { echo "done — no metadata change"; exit 0; }

          # Metadata: edit only the `completed:` line inside the solo:metadata block.
          DATE=""
          if [ "$META" = "set" ]; then
            DATE=$(TZ="$SOLO_TZ" date -d "${CLOSED_AT:-now}" +%F)
          fi
          jq -j '.body // ""' <<< "$ISSUE" > body.old
          awk -v mode="$META" -v date="$DATE" '
            BEGIN { inblk = 0; seen = 0; hasblk = 0 }
            /^<!-- solo:metadata[[:space:]]*$/ && !hasblk { inblk = 1; hasblk = 1; print; next }
            inblk && /^-->/ {
              if (mode == "set" && !seen) print "completed: " date
              inblk = 0; print; next
            }
            inblk && /^completed:/ {
              seen = 1
              if (mode == "clear") { print "completed:"; next }
              if ($0 ~ /^completed:[[:space:]]*$/) { print "completed: " date; next }
              print; next   # existing value — never overwrite
            }
            { print }
            END {
              if (!hasblk && mode == "set")
                printf "\n<!-- solo:metadata\ncompleted: %s\n-->\n", date
            }
          ' body.old > body.new

          if cmp -s body.old body.new; then
            echo "metadata already correct — no-op"
          else
            gh issue edit "$NUMBER" --repo "$REPO" --body-file body.new
            echo "metadata updated"
          fi
          echo "done — issue #$NUMBER synced"
