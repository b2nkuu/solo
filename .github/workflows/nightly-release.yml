name: Nightly Release

on:
  schedule:
    # 00:00 UTC daily
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Tag + Release if new commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute CalVer
        id: ver
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "tag=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Skip if no commits since last tag
        id: gate
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            echo "no prior tag — will release"
            echo "release=yes" >> "$GITHUB_OUTPUT"
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git rev-list "$LAST..HEAD" --count)
          echo "$COUNT commits since $LAST"
          echo "prev_tag=$LAST" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "HEAD = $LAST — nothing to release"
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for escape-hatch labels on open PRs
        id: escape
        if: steps.gate.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip release if any open PR carries [wip] or do-not-release label.
          BLOCKERS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --json number,title,labels \
            --jq '[.[] | select(.labels[]?.name | test("^(\\[wip\\]|do-not-release)$"; "i"))] | length')
          echo "blocker_count=$BLOCKERS"
          if [ "${BLOCKERS:-0}" -gt 0 ]; then
            echo "open PR(s) with [wip] or do-not-release label — skipping release"
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --json number,title,labels \
              --jq '.[] | select(.labels[]?.name | test("^(\\[wip\\]|do-not-release)$"; "i")) | "  #\(.number) \(.title)"'
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi
